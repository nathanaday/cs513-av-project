# A CARLA server and the pyotter client on one Linux machine with an NVIDIA GPU.
# Use the run script beside this file, or:
#   docker compose up -d carla
#   docker compose run --rm otter wait --host carla
#   docker compose run --rm otter drive /runs/SCENARIO.json.gz --host carla
#   docker compose down
services:
  carla:
    image: carlasim/carla:0.9.16
    command: bash CarlaUE4.sh -RenderOffScreen -nosound -quality-level=Low
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  otter:
    build:
      context: ../../..
      dockerfile: use-pyotter/carla/docker/Client.Dockerfile
    volumes:
      - ../../runs:/runs
