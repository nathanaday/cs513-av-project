# Settings of the lab commands (carla-server, otter-drive, otter-scenarios,
# otter-results, otter-check, otter-build). Read through SETTINGS in otterlab/settings.py.

# Hugging Face datasets: every scenario file, and the telemetry of every run.
scenarios_repo: otter-usc/otter-scenarios
results_repo: otter-usc/otter-telemetry

# The toolchain image: the CARLA server and a Python with the CARLA client.
# .github/workflows/toolchain-image.yml builds and pushes exactly this name.
image: ghcr.io/nathanaday/cs513-av-project/carla-toolchain:0.9.16-1

# Where the converted image is kept on the cluster. {user} is your login name.
# The OTTER_HOME environment variable overrides it.
storage: /project2/jdeshmuk_786/{user}/otter

slurm:
  account: jdeshmuk_786
  modules: [apptainer]
  server:
    partition: gpu
    time: "02:00:00"
    cpus: 8
    memory: 32G
    options: ["--gres=gpu:1"]   # any further sbatch options
  drive:
    partition: main
    time: "00:30:00"
    cpus: 2
    memory: 8G
    options: []

carla:
  port: 2370                    # first port tried; the server moves up if it is taken
  port_step: 10
  port_attempts: 50
  arguments: ["-nullrhi", "-nosound"]
  start_timeout_s: 600          # from launch until the server must answer

watch:
  poll_s: 3.0                   # how often carla-server asks Slurm for news

# otter-build: the scenario set. The trip and weights are those of drive_scenario.ipynb.
build:
  template: town10
  start_spawn: 18               # spawn point indexes of the trip
  end_spawn: 127
  risk_scale: 2.0
  hazard_weights: {pedestrian: 20.0}
  duration_s: 150.0             # seconds of hazards to roll
  seeds: [1, 2, 3, 4, 5]
