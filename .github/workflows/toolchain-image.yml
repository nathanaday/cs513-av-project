# Build the toolchain image and push it to the GitHub container registry under
# the name in use-pyotter/otter.yaml. To publish a new image, raise the tag
# there (0.9.16-1 to 0.9.16-2) in the same change as the Dockerfile.
name: toolchain-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - use-pyotter/carla/image/**
      - .github/workflows/toolchain-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The CARLA base image is about 9 GB compressed, more than a runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Read the image name
        id: image
        run: echo "name=$(sed -n 's/^image: *//p' use-pyotter/otter.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: use-pyotter/carla/image
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=CARLA 0.9.16 server and Python client for pyotter
